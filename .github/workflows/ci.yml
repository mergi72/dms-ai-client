name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[dev]

      - name: Run tests
        run: python -m pytest -q

      - name: Build wheel
        run: python -m pip wheel . --no-deps --wheel-dir tmp/wheel-check

      - name: Verify packaged configuration
        run: >-
          python -c "import glob, zipfile;
          names=set(zipfile.ZipFile(glob.glob('tmp/wheel-check/*.whl')[0]).namelist());
          assert {'dms_ai_client/default_config/client.json',
          'dms_ai_client/default_config/voice.json',
          'dms_ai_client/default_config/skills.json'} <= names"
